<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A PIECE OF CAKE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Dancing Script', cursive;
            touch-action: none;
            position: relative; 
        }

        /* Wrap everything to apply the SVG Cartoon Filter globally */
        #game-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #8b0000 0%, #2a0000 100%);
            filter: url(#cartoon-stroke); /* The magic post-processing shader */
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            /* Forces sharp edges when the low-res canvas is scaled up */
            image-rendering: pixelated; 
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #top-center-hud {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #FFD700;
            text-shadow: 0 0 5px #FF8C00, 0 0 10px #FF8C00;
            font-size: 50px;
            white-space: nowrap;
        }

        #scoreVal {
            display: inline-block;
        }

        #progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25px;
            background: rgba(0, 0, 0, 0.8);
            border-top: 3px solid #FFD700;
            box-shadow: 0 -5px 15px rgba(255, 140, 0, 0.5);
            box-sizing: border-box;
        }

        #progress-bar {
            height: 100%;
            width: 100%; 
            background: linear-gradient(90deg, #D32F2F, #FF8C00, #FFD700);
            position: relative;
        }

        #lion-indicator {
            position: absolute;
            right: -25px; 
            top: -40px; 
            width: 70px;
            height: 70px;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.6));
        }

        .lion-mane { animation: maneTwitch 0.6s infinite alternate ease-in-out; transform-origin: 50% 50%; }
        .lion-head { animation: headBob 0.4s infinite alternate ease-in-out; transform-origin: 50% 80%; }
        .lion-eyes { animation: blink 4s infinite; transform-origin: 50% 45px; }
        .lion-jaw { animation: chomp 0.3s infinite alternate cubic-bezier(0.25, 1, 0.5, 1); transform-origin: 50% 65px; }

        @keyframes maneTwitch { 0% { transform: scale(1) rotate(-3deg); } 100% { transform: scale(1.03) rotate(3deg); } }
        @keyframes headBob { 0% { transform: translateY(0) rotate(-5deg); } 100% { transform: translateY(-6px) rotate(5deg); } }
        @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0); } }
        @keyframes chomp { 0% { transform: translateY(0); } 100% { transform: translateY(6px) scale(1.05); } }

        #center-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #FFD700;
            font-size: 90px;
            text-shadow: 0 0 10px #FF0000, 0 0 20px #FF8C00;
            text-align: center;
        }

        #restart-btn {
            margin-top: 20px;
            padding: 10px 40px;
            font-size: 32px;
            font-family: 'Dancing Script', cursive;
            background: linear-gradient(to bottom, #FFD700, #FF8C00);
            border: none;
            border-radius: 15px;
            color: #8b0000;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            display: none;
            transition: transform 0.2s;
        }
        
        #restart-btn:hover {
            transform: scale(1.1);
        }

        .floating-text {
            position: absolute;
            font-size: 36px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.8);
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <svg width="0" height="0" style="position:absolute; z-index:-1; pointer-events:none;">
        <filter id="cartoon-stroke" x="0%" y="0%" width="100%" height="100%">
            <feComponentTransfer in="SourceGraphic" result="poster">
                <feFuncR type="discrete" tableValues="0 0.25 0.5 0.75 1"/>
                <feFuncG type="discrete" tableValues="0 0.25 0.5 0.75 1"/>
                <feFuncB type="discrete" tableValues="0 0.25 0.5 0.75 1"/>
            </feComponentTransfer>
            
            <feConvolveMatrix order="3 3" preserveAlpha="false" kernelMatrix="
                -1 -1 -1
                -1  8 -1
                -1 -1 -1" in="poster" result="edges"/>
                
            <feColorMatrix type="luminanceToAlpha" in="edges" result="edge_alpha"/>
            
            <feComponentTransfer in="edge_alpha" result="strong_alpha">
                <feFuncA type="linear" slope="4" intercept="0"/>
            </feComponentTransfer>
            
            <feFlood flood-color="black" result="black_color"/>
            
            <feComposite operator="in" in="black_color" in2="strong_alpha" result="black_edges"/>
            
            <feComposite operator="over" in="black_edges" in2="poster"/>
        </filter>
    </svg>

    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div id="top-center-hud">
                Score: <span id="scoreVal">0</span>
            </div>
            
            <div id="progress-container">
                <div id="progress-bar">
                    <div id="lion-indicator">
                        <svg viewBox="0 0 100 100" width="100%" height="100%">
                            <path class="lion-mane" d="M10,50 Q10,10 50,10 Q90,10 90,50 Q90,90 50,90 Q10,90 10,50" fill="#FFC107" />
                            <g class="lion-head">
                                <rect x="20" y="30" width="60" height="35" rx="15" fill="#D32F2F" />
                                <polygon points="50,15 40,35 60,35" fill="#00FF00" />
                                <g class="lion-eyes">
                                    <circle cx="35" cy="45" r="12" fill="#FFFFFF" />
                                    <circle cx="35" cy="45" r="5" fill="#000000" />
                                    <circle cx="65" cy="45" r="12" fill="#FFFFFF" />
                                    <circle cx="65" cy="45" r="5" fill="#000000" />
                                </g>
                                <g class="lion-jaw">
                                    <rect x="25" y="60" width="50" height="15" rx="5" fill="#D32F2F" />
                                    <path d="M 30 60 L 35 68 L 40 60 L 45 68 L 50 60 L 55 68 L 60 60 L 65 68 L 70 60" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
                                    <circle cx="25" cy="65" r="6" fill="#FF8C00" />
                                    <circle cx="75" cy="65" r="6" fill="#FF8C00" />
                                </g>
                                <circle cx="50" cy="30" r="8" fill="#FFFFFF" />
                            </g>
                        </svg>
                    </div>
                </div>
            </div>

            <div id="center-message">
                <div id="messageText">Ready?</div>
                <button id="restart-btn" onclick="startGame()">Play Again</button>
            </div>
            
            <div id="floating-container"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const scoreEl = document.getElementById('scoreVal');
        const progressBar = document.getElementById('progress-bar');
        const messageText = document.getElementById('messageText');
        const restartBtn = document.getElementById('restart-btn');
        const floatContainer = document.getElementById('floating-container');

        // PIXELATION FACTOR: The higher the number, the chunkier the graphics
        const PIXEL_SCALE = 4;

        let width, height;
        let items = [];
        let particles = [];
        let score = 0;
        let maxTime = 30;
        let timeLeft = maxTime;
        let gameSecondsElapsed = 0;
        let gameState = 'INIT'; 
        let lastTime = 0;
        let spawnTimer = 0;
        let gameTimerInterval;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            
            // Physical DOM size (full screen)
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            
            // Internal rendering resolution (low res for pixelation)
            canvas.width = width / PIXEL_SCALE;
            canvas.height = height / PIXEL_SCALE;
            
            // Scale the context down so our game coordinate math stays completely unchanged
            ctx.scale(1 / PIXEL_SCALE, 1 / PIXEL_SCALE);
            ctx.imageSmoothingEnabled = false; // Prevent blurring
        }
        
        window.addEventListener('resize', resize);
        resize();

        class FallingItem {
            constructor(difficulty = 0) {
                this.radius = 35;
                this.x = Math.random() * (width - this.radius * 2) + this.radius;
                this.y = -this.radius;
                this.type = Math.random() > 0.25 ? 'packet' : 'demon'; 
                
                this.vy = ((Math.random() * 3 + 2) + (difficulty * 4)) * 1.5; 
                this.vx = ((Math.random() - 0.5) * 1.5) * 1.5;
                
                this.spinAngle = Math.random() * Math.PI * 2;
                this.spinSpeed = (Math.random() * 0.1 + 0.05) * (Math.random() > 0.5 ? 1 : -1);
                this.scale = 1;
            }

            update() {
                this.y += this.vy;
                this.x += this.vx;
                this.spinAngle += this.spinSpeed; 
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                let spinScaleX = Math.cos(this.spinAngle);
                ctx.scale(spinScaleX * this.scale, this.scale);

                if (this.type === 'packet') {
                    ctx.fillStyle = '#D32F2F';
                    ctx.fillRect(-20, -30, 40, 60);
                    ctx.fillStyle = '#FFC107'; 
                    ctx.fillRect(-20, -30, 40, 10);
                    ctx.beginPath();
                    ctx.arc(0, 5, 10, 0, Math.PI * 2);
                    ctx.fillStyle = '#FFC107';
                    ctx.fill();
                    ctx.strokeStyle = '#FF8C00';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else if (this.type === 'demon') {
                    ctx.fillStyle = '#1A1A1A'; 
                    ctx.beginPath();
                    ctx.arc(0, 0, 25, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FF0000';
                    ctx.beginPath();
                    ctx.arc(-8, -5, 5, 0, Math.PI * 2);
                    ctx.arc(8, -5, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath();
                    ctx.moveTo(-10, 5); ctx.lineTo(-5, 15); ctx.lineTo(0, 5);
                    ctx.moveTo(10, 5); ctx.lineTo(5, 15); ctx.lineTo(0, 5);
                    ctx.fill();
                } else if (this.type === 'timer') {
                    ctx.fillStyle = '#00BFFF';
                    ctx.beginPath();
                    ctx.arc(0, 0, 25, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.stroke();
                    ctx.strokeStyle = '#FFF';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(0, 0); ctx.lineTo(0, -15);
                    ctx.moveTo(0, 0); ctx.lineTo(10, 0);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 12;
                this.vy = (Math.random() - 0.5) * 12;
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.02;
                this.color = color;
                this.size = Math.random() * 6 + 3;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createParticles(x, y, type) {
            let colors = [];
            if (type === 'packet') colors = ['#FFD700', '#FF8C00', '#FF0000'];
            else if (type === 'demon') colors = ['#4A00E0', '#8E2DE2', '#000000'];
            else colors = ['#00BFFF', '#FFFFFF', '#00FA9A'];

            for (let i = 0; i < 20; i++) {
                particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
            }
        }

        function createFloatingText(x, y, text, color) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.color = color;
            floatContainer.appendChild(el);

            gsap.to(el, {
                y: -50,
                opacity: 0,
                duration: 1,
                ease: "power1.out",
                onComplete: () => el.remove()
            });
        }

        function updateProgressBar(smooth = true) {
            let percentage = (timeLeft / maxTime) * 100;
            if (percentage > 100) percentage = 100;
            
            if (smooth) {
                gsap.to(progressBar, { width: `${percentage}%`, duration: 1, ease: "none", overwrite: true });
            } else {
                gsap.to(progressBar, { width: `${percentage}%`, duration: 0.5, ease: "back.out(1.5)", overwrite: true });
            }
        }

        function handleInput(e) {
            if (gameState !== 'PLAYING') return;

            let rect = canvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            // Because we scaled the canvas context mathematically rather than DOM-scaling,
            // the hit coordinates magically map 1:1 without any conversion needed!
            let clickX = clientX - rect.left;
            let clickY = clientY - rect.top;

            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                let dist = Math.hypot(clickX - item.x, clickY - item.y);
                
                if (dist < 45) { 
                    if (item.type === 'packet') {
                        score += 1;
                        createFloatingText(item.x, item.y, "+1", "#FFD700");
                        gsap.fromTo(scoreEl, {scale: 1.8, color: '#FFF'}, {scale: 1, color: '#FFD700', duration: 0.3, ease: "back.out(2)"});
                    } else if (item.type === 'demon') {
                        score -= 2;
                        createFloatingText(item.x, item.y, "-2", "#FF0000");
                        gsap.fromTo(scoreEl, {scale: 1.8, color: '#FF0000'}, {scale: 1, color: '#FFD700', duration: 0.3});
                        
                        // Body shake so it doesn't break the wrapper's SVG filter
                        gsap.to(document.body, {
                            x: () => Math.random() * 15 - 7.5,
                            y: () => Math.random() * 15 - 7.5,
                            filter: "grayscale(100%)",
                            duration: 0.05,
                            repeat: 5,
                            yoyo: true,
                            onComplete: () => {
                                gsap.set(document.body, { x: 0, y: 0, filter: "none", clearProps: "all" });
                            }
                        });

                    } else if (item.type === 'timer') {
                        timeLeft = Math.min(maxTime, timeLeft + 5);
                        updateProgressBar(false);
                        createFloatingText(item.x, item.y, "+5s!", "#00BFFF");
                        gsap.fromTo(progressBar, {filter: "brightness(2)"}, {filter: "brightness(1)", duration: 0.5});
                    }
                    
                    scoreEl.innerText = score;
                    createParticles(item.x, item.y, item.type);
                    items.splice(i, 1);
                    break;
                }
            }
        }

        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(e); }, {passive: false});

        function animateCenterText(text) {
            messageText.innerText = text;
            messageText.style.opacity = 1;
            gsap.fromTo(messageText, 
                {scale: 0.2, opacity: 0}, 
                {scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.7)"}
            );
            gsap.to(messageText, {opacity: 0, duration: 0.3, delay: 0.7});
        }

        function startPreGameTimer() {
            gameState = 'COUNTDOWN';
            restartBtn.style.display = 'none';
            score = 0;
            timeLeft = maxTime;
            gameSecondsElapsed = 0;
            scoreEl.innerText = score;
            
            gsap.set(progressBar, { width: "100%" });

            items = [];
            particles = [];

            let count = 3;
            animateCenterText(count);

            let countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    animateCenterText(count);
                } else {
                    clearInterval(countdownInterval);
                    animateCenterText('GO!');
                    setTimeout(() => {
                        messageText.innerText = '';
                        gameState = 'PLAYING';
                        startGameTimer();
                    }, 800);
                }
            }, 1000);
        }

        function startGameTimer() {
            gameTimerInterval = setInterval(() => {
                timeLeft--;
                gameSecondsElapsed++;
                
                updateProgressBar(true);

                if (timeLeft <= 5 && timeLeft > 0) {
                    gsap.fromTo(progressBar, {x: -5}, {x: 5, duration: 0.1, yoyo: true, repeat: 3});
                }

                if (gameSecondsElapsed % 10 === 0) {
                    let difficultyMultiplier = (maxTime - Math.max(0, timeLeft)) / maxTime;
                    let timerItem = new FallingItem(difficultyMultiplier);
                    timerItem.type = 'timer';
                    items.push(timerItem);
                }

                if (timeLeft <= 0) {
                    clearInterval(gameTimerInterval);
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameState = 'GAMEOVER';
            messageText.style.opacity = 1;
            messageText.innerHTML = `Time's Up!<br>Score: ${score}`;
            gsap.fromTo(messageText, {scale: 0.5, opacity: 0, y: 50}, {scale: 1, opacity: 1, y: 0, duration: 0.8, ease: "elastic.out(1, 0.5)"});
            restartBtn.style.display = 'inline-block';
            gsap.fromTo(restartBtn, {scale: 0, opacity: 0}, {scale: 1, opacity: 1, duration: 0.5, delay: 0.5, ease: "back.out(1.5)"});
        }

        function startGame() {
            startPreGameTimer();
        }

        function loop(timestamp) {
            let deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            // Clearing the context still works properly over the whole screen
            // because our context math handles the downscaling!
            ctx.clearRect(0, 0, width, height);

            if (gameState === 'PLAYING') {
                let difficultyMultiplier = Math.max(0, maxTime - timeLeft) / maxTime; 
                let currentSpawnDelay = 225 - (difficultyMultiplier * 150); 

                spawnTimer += deltaTime;
                if (spawnTimer > currentSpawnDelay) {
                    items.push(new FallingItem(difficultyMultiplier));
                    spawnTimer = 0;
                }
            }

            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                if (gameState === 'PLAYING') item.update();
                item.draw(ctx);
                if (item.y > height + 100) items.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
        startGame(); 
    </script>
</body>
</html>
